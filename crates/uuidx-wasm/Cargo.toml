[package]
name = "uuidx-wasm"
version.workspace = true
description = "WebAssembly bindings for UUID generation, validation, formatting, and inspection with uuidx"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ulid-inspect"]
ulid-inspect = ["uuidx-core/ulid-inspect"]

[dependencies]
hex = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
uuidx-core.workspace = true
wasm-bindgen = "0.2"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.24", features = ["rng-getrandom"] }

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"
