name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify_tag:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_cargo: ${{ steps.version.outputs.publish_cargo }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and workspace versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)(\.(0|[1-9][0-9]*))?)?$'

          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            echo "Expected vMAJOR.MINOR.PATCH with an optional -beta[.N] or -rc[.N] suffix." >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          package_count="$(jq '[.packages[] | select(.name == "uuidx-core" or .name == "uuidx-cli" or .name == "uuidx-wasm" or .name == "uuidx-ffi")] | length' <<<"$metadata")"
          version_count="$(jq '[.packages[] | select(.name == "uuidx-core" or .name == "uuidx-cli" or .name == "uuidx-wasm" or .name == "uuidx-ffi") | .version] | unique | length' <<<"$metadata")"
          version="$(jq -r '.packages[] | select(.name == "uuidx-cli") | .version' <<<"$metadata")"

          test "$package_count" -eq 4
          test "$version_count" -eq 1
          test "v$version" = "$GITHUB_REF_NAME"

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          if [[ "$version" =~ ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            publish_cargo=true
          else
            publish_cargo=false
          fi

          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish_cargo=$publish_cargo" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify_tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binary
        run: cargo build --locked --release --package uuidx-cli --target "$env:TARGET" --all-features
        if: runner.os == 'Windows'
      - name: Build release binary
        run: cargo build --locked --release --package uuidx-cli --target "$TARGET" --all-features
        if: runner.os != 'Windows'
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/uuidx-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" uuidx
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = "target\$env:TARGET\release\uuidx.exe"
          $archive = "dist\uuidx-$env:GITHUB_REF_NAME-$env:TARGET.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uuidx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github_release:
    name: Publish GitHub release
    needs:
      - verify_tag
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: uuidx-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum uuidx-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify_tag.outputs.prerelease }}
        shell: bash
        run: |
          args=(
            "$GITHUB_REF_NAME"
            dist/*
            --verify-tag
            --generate-notes
            --title "uuidx $GITHUB_REF_NAME"
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  crates_io:
    name: Publish crates.io packages
    if: needs.verify_tag.outputs.publish_cargo == 'true'
    needs:
      - verify_tag
      - github_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Publish workspace packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked \
            --package uuidx-core \
            --package uuidx-cli \
            --package uuidx-wasm \
            --package uuidx-ffi
