name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          # The CLI schema must exactly match the wasm-bindgen version in Cargo.lock.
          tool: wasm-bindgen@0.2.127
      - name: Create coverage output directory
        run: mkdir -p target/coverage
      - name: Clear previous coverage artifacts
        run: cargo llvm-cov clean --workspace
      - name: Collect all-feature coverage
        run: cargo llvm-cov --locked --workspace --all-features --no-report
      - name: Collect minimal-feature coverage
        run: cargo llvm-cov --locked --workspace --no-default-features --no-report
      - name: Enforce coverage thresholds
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex 'uuidx-wasm[/\\]src[/\\]lib\.rs$'
          --fail-under-lines 97
          --fail-under-functions 96
          --fail-under-regions 96
      - name: Generate LCOV report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex 'uuidx-wasm[/\\]src[/\\]lib\.rs$'
          --lcov
          --output-path target/coverage/lcov.info
      - name: Test WebAssembly exports
        env:
          WASM_BINDGEN_BENCH_RESULT: target/wbg_benchmark.json
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --package uuidx-wasm --target wasm32-unknown-unknown --all-features
      - name: Test WebAssembly exports without default features
        env:
          WASM_BINDGEN_BENCH_RESULT: target/wbg_benchmark.json
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --package uuidx-wasm --target wasm32-unknown-unknown --no-default-features
      - name: Upload LCOV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
